<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeMentor AI</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        background: #0f172a;
        color: #e5e7eb;
        font-family: Arial, sans-serif;
      }

      main {
        padding: 18px;
      }

      h1 {
        margin: 0 0 6px;
        color: #f8fafc;
        font-size: 20px;
      }

      p {
        margin: 0 0 16px;
        color: #cbd5e1;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 14px 0 8px;
        color: #bfdbfe;
        font-size: 13px;
        font-weight: 700;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 11px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #020617;
        color: #f8fafc;
        font-size: 14px;
      }

      button {
        width: 100%;
        margin-top: 10px;
        padding: 10px 12px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      .secondary {
        background: #334155;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #86efac;
        font-size: 13px;
        line-height: 1.4;
      }

      .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }

      .modes span {
        padding: 8px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #111827;
        color: #dbeafe;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CodeMentor AI</h1>
      <p>Gemini responde primeiro. Se falhar, Groq entra como reserva.</p>

      <label for="geminiKey">Chave do Gemini</label>
      <input id="geminiKey" type="password" autocomplete="off" placeholder="AIza...">

      <label for="groqKey">Chave da Groq</label>
      <input id="groqKey" type="password" autocomplete="off" placeholder="gsk_...">

      <button id="save" type="button">Salvar chaves</button>

      <div class="row">
        <button id="testGemini" type="button" class="secondary">Testar Gemini</button>
        <button id="testGroq" type="button" class="secondary">Testar Groq</button>
      </div>

      <button id="clear" type="button" class="secondary">Limpar chaves salvas</button>
      <div id="status" role="status"></div>

      <div class="modes" aria-label="Modos disponíveis">
        <span>Resposta direta</span>
        <span>Alternativa correta</span>
        <span>Código completo</span>
        <span>Correção curta</span>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
